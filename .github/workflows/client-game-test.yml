# Клиентские игровые тесты: настоящий клиент нажимает клавиши и измеряет движение игрока
# в одиночной игре и на выделенном сервере, проверяет звуки, пак в архиве и модели.
#
# Видеокарты на машинах GitHub нет: игра рисует программно (Mesa llvmpipe), а окно SDL
# создаётся в памяти (драйвер offscreen), без виртуального экрана. С xvfb и GLX клиент
# Minecraft 26.3 зависает.
#
# Запускается на каждый PR, обе задачи обязательны для слияния.
#
# Две задачи:
#   client-game-test — тесты в среде разработки (gradlew runClientGameTest);
#   production-client-game-test — те же тесты на готовом jar мода в настоящем клиенте Fabric.

name: client-game-test

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: client-game-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-game-test:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-24.04
    # Обычный прогон занимает около четырёх минут; если клиент завис, незачем ждать дольше.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: client-game-test
            gradle: runClientGameTest
            run: build/run/clientGameTest
          - name: production-client-game-test
            gradle: productionClientGameTest
            run: build/run/productionClientGameTest
    env:
      # Программный OpenGL и окно в памяти.
      LIBGL_ALWAYS_SOFTWARE: "1"
      SDL_VIDEO_DRIVER: offscreen
      EGL_PLATFORM: surfaceless
    steps:
      - name: checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: setup jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: install software renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libegl1 libegl-mesa0
      - name: run client game tests
        run: ./gradlew ${{ matrix.task.gradle }}
      - name: store client test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.task.name }}-logs
          path: |
            ${{ matrix.task.run }}/logs/
            ${{ matrix.task.run }}/crash-reports/
            ${{ matrix.task.run }}/screenshots/
