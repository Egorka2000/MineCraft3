# Сборка и тесты на каждый PR и на каждый коммит в main.
# Задача build включает проверки компилятора (-Werror), Checkstyle,
# юнит-тесты мода (src/test) и математики движения (physics/src/test),
# серверные игровые тесты (src/gametest) и проверку состава jar.

name: build

on:
  pull_request:
  push:
    branches: [main]

# Новый коммит в ту же ветку отменяет ещё не законченный прогон.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Проверяет подлинность gradle-wrapper.jar и кеширует зависимости между прогонами.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build, lint and test
        run: ./gradlew build
      - name: store lint and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/build/junit.xml
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tf2mc-jar
          path: build/libs/

  # Клиентские игровые тесты: настоящий клиент на виртуальном экране нажимает клавиши и измеряет
  # движение игрока в одиночной игре и на выделенном сервере. Отдельная задача, потому что ей
  # нужен экран и она заметно дольше сборки.
  client-game-test:
    runs-on: ubuntu-24.04
    # Обычный прогон занимает несколько минут; если клиент завис, незачем ждать дольше.
    timeout-minutes: 15
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Программный OpenGL (Mesa): на машинах CI нет видеокарты.
      - name: install software renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils
      # Экран с глубиной цвета 24 бита и расширением GLX: на экране xvfb по умолчанию
      # игра не находит подходящий режим OpenGL и не создаёт окно.
      - name: run client game tests
        run: xvfb-run -a --server-args="-screen 0 1280x720x24 +extension GLX +render -noreset" ./gradlew runClientGameTest
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
      - name: store client test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-logs
          path: |
            **/build/run/clientGameTest/logs/
            **/build/run/clientGameTest/crash-reports/
            **/build/run/clientGameTest/screenshots/
