# Сборка и тесты на каждый PR и на каждый коммит в main.
# Задача build включает проверки компилятора (-Werror), Checkstyle,
# юнит-тесты мода (src/test) и математики движения (physics/src/test) с отчётом о покрытии,
# серверные игровые тесты (src/gametest) в среде разработки и на готовом jar
# в настоящем сервере Fabric, проверку состава jar.
# Клиентские тесты и скрипты пака — в client-game-test.yml и pack-tools.yml.

name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Новый коммит в ветку PR отменяет ещё не законченный прогон по ней: устаревший результат не нужен.
# В main прогоны не отменяются и не ждут друг друга: у каждого коммита своя группа, поэтому
# при нескольких слияниях подряд каждый коммит получает свой результат, а не отметку "cancelled".
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Внешние действия закреплены по хешу коммита: тег можно переписать, хеш — нет.
      - name: checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: setup jdk
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Проверяет подлинность gradle-wrapper.jar и кеширует зависимости между прогонами.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build, lint and test
        run: ./gradlew build
      - name: store lint and test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/build/junit.xml
      - name: store coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage
          path: |
            build/reports/jacoco/test/
            physics/build/reports/jacoco/test/
          retention-days: 14
      # jar из main хранится дольше: его можно скачать и поставить; jar из PR нужен недолго.
      - name: capture build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tf2mc-jar
          path: build/libs/
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
