# Сборка и тесты на каждый PR и на каждый коммит в main.
# Задача build включает проверки компилятора (-Werror), Checkstyle,
# юнит-тесты мода (src/test) и математики движения (physics/src/test),
# серверные игровые тесты (src/gametest) и проверку состава jar.

name: build

on:
  pull_request:
  push:
    branches: [main]

# Новый коммит в ветку PR отменяет ещё не законченный прогон по ней: устаревший результат не нужен.
# В main прогоны не отменяются и не ждут друг друга: у каждого коммита своя группа, поэтому
# при нескольких слияниях подряд каждый коммит получает свой результат, а не отметку "cancelled".
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      # Проверяет подлинность gradle-wrapper.jar и кеширует зависимости между прогонами.
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build, lint and test
        run: ./gradlew build
      - name: store lint and test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/**/logs/
            **/build/junit.xml
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tf2mc-jar
          path: build/libs/
