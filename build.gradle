plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'checkstyle'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// GeckoLib берётся из хранилища Modrinth; из него разрешена только эта группа.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"tf2mc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Серверные игровые тесты: отдельный набор исходников src/gametest, запускаются задачей build.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "tf2mc-test"
		enableGameTests = true
		enableClientGameTests = true
		// Значение true означает согласие с EULA Minecraft (принято владельцем проекта).
		eula = true
	}
}

// Юнит-тесты проверяют и клиентскую точку входа, поэтому видят набор client.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

interface ArchiveAccess {
	@javax.inject.Inject
	ArchiveOperations getArchives()
}

configurations {
	// То, что упаковывается внутрь jar мода.
	bundled {
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	bundled project(":physics")

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Скелетная анимация моделей персонажей. Нужна только клиенту: сервер работает и без неё.
	clientImplementation "maven.modrinth:geckolib:${project.geckolib_version}"

	// Математика движения. Её классы кладутся прямо в jar мода, см. блок jar ниже.
	implementation project(":physics")

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

test {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
	// Предупреждения компилятора считаются ошибками.
	// Отключены две категории, которые сообщают не о коде мода:
	// processing — шум от обработчиков аннотаций, classfile — аннотации внутри чужих jar.
	it.options.compilerArgs.addAll(["-Xlint:all,-processing,-classfile", "-Werror"])
}

// Checkstyle проверяет все наборы исходников и входит в задачу check, а значит и в build.
// Правила: config/checkstyle/checkstyle.xml.
checkstyle {
	toolVersion = project.checkstyle_version
	maxWarnings = 0
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	// Классы подпроекта physics попадают в jar мода: отдельным файлом он не поставляется.
	// ArchiveOperations берётся из сервисов Gradle: вызов zipTree напрямую из скрипта
	// несовместим с кешем конфигурации.
	def archives = objects.newInstance(ArchiveAccess).archives
	from(configurations.bundled.elements.map { files -> files.collect { archives.zipTree(it) } }) {
		exclude "META-INF/MANIFEST.MF"
	}
}

// Собранный jar должен содержать и мод, и математику движения: без неё мод упадёт только при запуске.
def verifyJarContents = tasks.register("verifyJarContents") {
	def jarFile = tasks.named("jar").flatMap { it.archiveFile }
	inputs.file(jarFile)

	doLast {
		def required = [
			"fabric.mod.json",
			"io/github/egorka2000/tf2mc/Tf2Mc.class",
			"io/github/egorka2000/tf2mc/physics/SourceMovement.class",
		]
		def entries = new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
			zip.entries().collect { it.name }
		}
		def missing = required.findAll { !entries.contains(it) }

		if (!missing.isEmpty()) {
			throw new GradleException("в jar мода нет файлов: ${missing}")
		}
	}
}

tasks.named("check") {
	dependsOn verifyJarContents
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
