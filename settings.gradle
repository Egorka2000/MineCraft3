pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'tf2mc'

// Чистая математика движения, без зависимостей от Minecraft.
include 'physics'

// Чтение моделей TF2 из расширительного пака, без зависимостей от Minecraft.
include 'sourcemodel'
